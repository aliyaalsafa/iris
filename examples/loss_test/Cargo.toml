[package]
name = "loss_test"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "loss_test"
path = "src/main.rs"

[dependencies]
# keep these aligned with your working versions
anyhow = "1.0.98"
clap = { version = "3.2.23", features = ["derive"] }
lazy_static = "1.5.0"
libc = "0.2.174"

# used by the loss_test code I gave you
rand = "0.8"
regex = "1"
ctrlc = "3"

# local iris crates (same paths you showed)
iris-core = { path = "../../core" }
iris-datatypes = { path = "../../datatypes" }
iris-compiler = { path = "../../compiler" }