[package]
name = "flow"
version = "0.1.0"
edition = "2024"

[dependencies]
iris-core = { path = "../../core" }
iris-datatypes = { path = "../../datatypes" }
iris-compiler = { path = "../../compiler" }
serde = { version = "1", features = ["rc"] }
clap = { version = "4.6.1", features = ["derive"] }

array-init = "2.1"
const_format = "0.2"
lazy_static = "1.5.0"
libc = "0.2.174"
env_logger = "0.8.4"
regex = "1.7.3"

arrow = { version = "57", optional = true }
parquet = { version = "57", optional = true }
serde_arrow = { version = "0.15.1", features = ["arrow-57"], optional = true }

lightgbm3 = { version = "1", optional = true }

[features]
collect = ["dep:arrow", "dep:parquet", "dep:serde_arrow"]
model = ["dep:lightgbm3"]

[[bin]]
name = "flow_collect"
path = "src/bin/flow_collect.rs"
required-features = ["collect"]

[[bin]]
name = "flow_test"
path = "src/bin/flow_test.rs"
required-features = ["model"]
