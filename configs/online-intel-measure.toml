main_core = 0
nb_memory_channels = 6

[mempool]
capacity = 1_048_576
cache_size = 512

[online]
duration = 30
nb_rxd = 4096
promiscuous = true
mtu = 1500
hardware_assist = true
dyn_hardware_assist = false
drop_tls_raw = true
drop_quic_raw = true
measure_raw_drop = true

[[online.ports]]
device = "0000:8a:00.1"
cores = [ 1, 2, 3, 4 ]

# Two sinks for per-protocol granularity: TLS -> first sink (qid 0, core 5),
# QUIC -> second sink (qid 1, core 6). nb_buckets defaults to 512 (= full RSS
# reta), so RSS traffic does NOT land on the sink queues — they only receive the
# matches we steer to them.
[[online.ports.sinks]]
core = 5

[[online.ports.sinks]]
core = 6

[conntrack]
max_connections = 1_000_000
max_out_of_order = 500
timeout_resolution = 100
udp_inactivity_timeout = 60000
tcp_inactivity_timeout = 300000
tcp_reassembly_timeout = 10000
tcp_establish_timeout = 5000

[online.monitor.display]
throughput = true
mempool_usage = true
port_stats = [ "rx_good_packets", "rx_good_bytes", "rx_missed_errors" ]
